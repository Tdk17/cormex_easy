name: cormex_easy
description: Catálogo inteligente de prestadores de serviços da família CormeX.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^8.0.3
  geolocator: ^14.0.2
  go_router: ^16.2.1
  http: ^1.5.0
  shared_preferences: ^2.5.3
  signals: ^6.0.2
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/hero-profissional-cliente.webp
