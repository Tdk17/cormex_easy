name: Deploy CormeX Easy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build production
        run: >-
          flutter build web --release
          --output=build/production
          --base-href=/cormex_easy/
          --dart-define=APP_ENV=production
          --dart-define=USE_QA_DATA=false
          --dart-define=PARSE_SERVER_URL=${{ vars.PARSE_SERVER_URL || 'https://parseapi.back4app.com' }}
          --dart-define=PARSE_APPLICATION_ID=${{ vars.PARSE_APPLICATION_ID || '' }}
          --dart-define=PARSE_CLIENT_KEY=${{ vars.PARSE_CLIENT_KEY || '' }}

      - name: Build QA
        run: >-
          flutter build web --release
          --output=build/qa
          --base-href=/cormex_easy/qa/
          --dart-define=APP_ENV=qa
          --dart-define=USE_QA_DATA=${{ vars.QA_USE_QA_DATA || 'false' }}
          --dart-define=PARSE_SERVER_URL=${{ vars.QA_PARSE_SERVER_URL || vars.PARSE_SERVER_URL || 'https://parseapi.back4app.com' }}
          --dart-define=PARSE_APPLICATION_ID=${{ vars.QA_PARSE_APPLICATION_ID || vars.PARSE_APPLICATION_ID || '' }}
          --dart-define=PARSE_CLIENT_KEY=${{ vars.QA_PARSE_CLIENT_KEY || vars.PARSE_CLIENT_KEY || '' }}

      - name: Assemble GitHub Pages artifact
        run: |
          mkdir -p build/pages/qa
          cp -R build/production/. build/pages/
          cp -R build/qa/. build/pages/qa/

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
